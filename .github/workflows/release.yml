name: Build and release

# On every push and PR: build and run the self-test.
# On a vX.Y.Z tag: publish the release with the .zip and SHA256SUMS.txt.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # only used to create the release on tags
    steps:
      - uses: actions/checkout@v4

      - name: Build, self-test and package
        shell: pwsh
        run: ./build.ps1 -Zip

      - uses: actions/upload-artifact@v4
        with:
          name: MultiRoblox
          path: |
            dist/MultiRoblox-v*.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = [regex]::Match((Get-Content src/AssemblyInfo.cs -Raw), 'AssemblyVersion\("(\d+\.\d+\.\d+)').Groups[1].Value
          if ("v$ver" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match the AssemblyInfo.cs version (v$ver)" }
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw -Encoding UTF8), "(?s)## \[$([regex]::Escape($ver))\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\r?\n\[[0-9]|\z)").Groups[1].Value.Trim()
          if (-not $notes) { throw "No [$ver] section in CHANGELOG.md" }
          Set-Content release-notes.md $notes -Encoding UTF8
          gh release create $env:GITHUB_REF_NAME "dist/MultiRoblox-v$ver.zip" dist/SHA256SUMS.txt --title "MultiRoblox v$ver" --notes-file release-notes.md
